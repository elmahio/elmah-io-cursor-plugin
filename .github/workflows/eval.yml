name: Skill evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Install eval runner dependencies
        working-directory: tests
        run: npm ci

      - name: Run skill evals against mock MCP server
        working-directory: tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node run-eval.mjs
