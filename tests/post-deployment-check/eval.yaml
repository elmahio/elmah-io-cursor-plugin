# Eval scenarios for skills/post-deployment-check against the mock MCP server
# (tests/mocks). See tests/README.md for the assertion schema and how to run this.

scenarios:
  - name: "Flags a regression introduced by the deployment"
    prompt: >
      /elmah-io:post-deployment-check I just deployed. Check the Production API
      log (log id 11111111-1111-1111-1111-111111111111) for anything broken.
    assertions:
      - type: tool_called
        tool: mcp__elmahio__deployments_list
      - type: tool_called
        tool: mcp__elmahio__uptime_list
      - type: output_matches
        pattern: "UNHEALTHY"
    timeout: 120

  - name: "No deployments found guardrail"
    prompt: >
      /elmah-io:post-deployment-check I just deployed. Check the Staging API log
      (log id 22222222-2222-2222-2222-222222222222) for anything broken.
    assertions:
      - type: tool_called
        tool: mcp__elmahio__deployments_list
      - type: output_matches
        pattern: "no deployment"
        flags: "i"
    timeout: 120
