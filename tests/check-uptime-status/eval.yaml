# Eval scenarios for skills/check-uptime-status against the mock MCP server
# (tests/mocks). See tests/README.md for the assertion schema and how to run this.

scenarios:
  - name: "Reports a partial outage with incident detail"
    prompt: >
      /elmah-io:check-uptime-status Is my site up? Check the Production API log
      (log id 11111111-1111-1111-1111-111111111111).
    assertions:
      - type: tool_called
        tool: mcp__elmahio__uptime_list
      - type: tool_called
        tool: mcp__elmahio__uptime_get_details
      - type: output_matches
        pattern: "PARTIAL OUTAGE"
      - type: output_matches
        pattern: "Status API"
    timeout: 120

  - name: "Keeps an all-healthy report brief"
    prompt: >
      /elmah-io:check-uptime-status Is my site up? Check the Staging API log
      (log id 22222222-2222-2222-2222-222222222222).
    assertions:
      - type: tool_called
        tool: mcp__elmahio__uptime_list
      - type: output_matches
        pattern: "all up"
        flags: "i"
    timeout: 120
